<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>熊家食堂</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #fef7e8; font-family: 'Segoe UI', 'Noto Sans SC', system-ui; }

        /* 英雄区：图片居中缩小，两侧菱形花格装饰 */
        .hero {
            background-color: #faefc9;
            display: flex;
            align-items: center;
            padding: 22px 0;
            box-shadow: 0 4px 20px rgba(180, 130, 20, 0.22);
        }
        /* 两侧花边：菱形底纹 + 飘浮食物图标 */
        .hero-deco {
            flex: 1;
            align-self: stretch;
            position: relative;
            overflow: hidden;
            background-color: #faefc9;
            background-image:
                radial-gradient(circle, rgba(180,130,20,0.38) 1.5px, transparent 1.5px),
                repeating-linear-gradient( 45deg, rgba(233,183,65,0.25) 0, rgba(233,183,65,0.25) 1px, transparent 0, transparent 50%),
                repeating-linear-gradient(-45deg, rgba(233,183,65,0.25) 0, rgba(233,183,65,0.25) 1px, transparent 0, transparent 50%);
            background-size: 20px 20px, 20px 20px, 20px 20px;
            background-position: 10px 10px, 0 0, 0 0;
        }
        @keyframes foodBob {
            0%, 100% { transform: translateY(0)    rotate(var(--r, 0deg)); }
            50%       { transform: translateY(-8px) rotate(var(--r, 0deg)); }
        }
        .food-float {
            position: absolute;
            z-index: 2;
            opacity: 0.9;
            user-select: none;
            pointer-events: none;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(120,60,0,0.12));
            animation: foodBob 3.2s ease-in-out infinite;
        }
        /* 图片主体：金边圆角框 */
        .hero-main {
            position: relative;
            width: 62%;
            max-width: 820px;
            flex-shrink: 0;
            border-radius: 18px;
            overflow: hidden;
            border: 3px solid #e9b741;
            box-shadow: 0 6px 28px rgba(180,130,20,0.28);
        }
        .hero-img {
            width: 100%; height: auto; display: block;
            filter: brightness(1.12) saturate(1.25);
        }
        /* 标题：金棕色，深色描边确保可读性 */
        .hero-title {
            position: absolute; top: 5%; left: 0; right: 0;
            display: flex; align-items: center; justify-content: center;
            z-index: 1;
            color: #7a3c10; font-size: 2.6rem; font-weight: 700; letter-spacing: 8px;
            text-shadow:
                0 2px 0 rgba(255,230,160,0.9),
                0 4px 14px rgba(0,0,0,0.55),
                0 0 22px rgba(255,210,120,0.4);
        }
        @media (max-width: 767px) {
            .hero-main { width: 92%; border-radius: 12px; }
            .hero-deco { display: none !important; }
            .hero-title { font-size: 1.6rem; letter-spacing: 3px; top: 5%; }
            /* 按钮上中下竖排 */
            .col-md-4 { width: 100% !important; max-width: 340px; margin-left: auto; margin-right: auto; }
        }

        /* 角色按钮：金色填充，深暖棕文字 */
        .role-btn {
            background: #e9b741; border: none;
            padding: 14px 28px; font-size: 1.2rem; font-weight: 600;
            border-radius: 48px; color: #3a2800;
            transition: all 0.22s ease;
            box-shadow: 0 3px 12px rgba(180, 130, 20, 0.28);
            min-width: 180px;
        }
        .role-btn:hover {
            background: #d4a12b; color: #3a2800;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(180, 130, 20, 0.38);
        }

        /* 操作按钮（模态框内） */
        .action-btn-group { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .action-btn {
            background: #e9b741; border: none;
            padding: 12px 28px; font-size: 1rem; font-weight: 500;
            border-radius: 40px; color: #3a2800;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(180, 130, 20, 0.22);
        }
        .action-btn:hover { background: #d4a12b; transform: scale(0.98); }

        /* 日历 */
        .calendar-table {
            width: 100%; border-collapse: collapse;
            background: #fffcf4; border-radius: 24px; overflow: hidden;
            box-shadow: 0 4px 16px rgba(180, 130, 20, 0.1);
        }
        .calendar-table thead { background: #faefc9; }
        .calendar-table th { color: #7a5c1e; font-weight: 600; }
        .calendar-table th, .calendar-table td { text-align: center; padding: 12px 6px; border: 1px solid #e8d8a0; }
        .calendar-table td { background: #fffcf4; cursor: pointer; transition: background 0.1s; }
        .calendar-table tr.selectable-row:hover td { background-color: #faefc9 !important; }
        .calendar-table td.disabled { background: #f5eed8 !important; color: #c0a860; cursor: not-allowed; }

        /* 月份导航 */
        .month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .month-nav button {
            background: none; border: 1.5px solid #e9b741;
            border-radius: 30px; padding: 6px 16px;
            color: #8a6820; cursor: pointer; transition: all 0.2s;
        }
        .month-nav button:hover { background: #faefc9; border-color: #d4a12b; }

        /* 熊家菜谱入口按钮（仅桌面显示） */
        .menu-entry-btn {
            background: #fffcf4; border: 2px solid #e9b741;
            padding: 12px 32px; font-size: 1.05rem; font-weight: 600;
            border-radius: 48px; color: #7a5c1e;
            transition: all 0.22s ease;
            box-shadow: 0 2px 10px rgba(180,130,20,0.15);
            text-decoration: none; display: inline-block;
        }
        .menu-entry-btn:hover {
            background: #faefc9; color: #3a2800;
            transform: translateY(-2px);
            box-shadow: 0 5px 16px rgba(180,130,20,0.28);
        }
        @media (max-width: 767px) { .menu-entry-wrap { display: none !important; } }
    </style>
</head>
<body>
<div class="hero">
    <div class="hero-deco">
        <span class="food-float" style="top:2%;left:7%;font-size:5rem;--r:-14deg;animation-delay:0s">🍗</span>
        <span class="food-float" style="top:11%;left:62%;font-size:4.5rem;--r:20deg;animation-delay:0.7s">🥙</span>
        <span class="food-float" style="top:20%;left:35%;font-size:5rem;--r:-10deg;animation-delay:1.5s">🥟</span>
        <span class="food-float" style="top:29%;left:8%;font-size:4.5rem;--r:22deg;animation-delay:0.4s">🍜</span>
        <span class="food-float" style="top:38%;left:62%;font-size:5rem;--r:-18deg;animation-delay:1.2s">🥘</span>
        <span class="food-float" style="top:47%;left:36%;font-size:4.5rem;--r:14deg;animation-delay:0.9s">🍲</span>
        <span class="food-float" style="top:56%;left:6%;font-size:5rem;--r:-8deg;animation-delay:1.8s">🦀</span>
        <span class="food-float" style="top:65%;left:63%;font-size:4.5rem;--r:24deg;animation-delay:0.3s">🍝</span>
        <span class="food-float" style="top:74%;left:35%;font-size:5rem;--r:-16deg;animation-delay:1.6s">🍳</span>
        <span class="food-float" style="top:82%;left:8%;font-size:4.5rem;--r:10deg;animation-delay:1.1s">🍖</span>
    </div>
    <div class="hero-main">
        <img src="/static/img/hero.jpg" class="hero-img" alt="熊家食堂插图">
        <span class="hero-title">熊家給食センター</span>
    </div>
    <div class="hero-deco">
        <span class="food-float" style="top:2%;right:7%;font-size:5rem;--r:14deg;animation-delay:0s">🍗</span>
        <span class="food-float" style="top:11%;right:62%;font-size:4.5rem;--r:-20deg;animation-delay:0.7s">🥙</span>
        <span class="food-float" style="top:20%;right:35%;font-size:5rem;--r:10deg;animation-delay:1.5s">🥟</span>
        <span class="food-float" style="top:29%;right:8%;font-size:4.5rem;--r:-22deg;animation-delay:0.4s">🍜</span>
        <span class="food-float" style="top:38%;right:62%;font-size:5rem;--r:18deg;animation-delay:1.2s">🥘</span>
        <span class="food-float" style="top:47%;right:36%;font-size:4.5rem;--r:-14deg;animation-delay:0.9s">🍲</span>
        <span class="food-float" style="top:56%;right:6%;font-size:5rem;--r:8deg;animation-delay:1.8s">🦀</span>
        <span class="food-float" style="top:65%;right:63%;font-size:4.5rem;--r:-24deg;animation-delay:0.3s">🍝</span>
        <span class="food-float" style="top:74%;right:35%;font-size:5rem;--r:16deg;animation-delay:1.6s">🍳</span>
        <span class="food-float" style="top:82%;right:8%;font-size:4.5rem;--r:-10deg;animation-delay:1.1s">🍖</span>
    </div>
</div>
<div class="container text-center mt-5">
    <div class="row justify-content-center g-4">
        <div class="col-md-4"><button class="btn role-btn w-100" id="bigBearBtn">🐻 大熊</button></div>
        <div class="col-md-4"><button class="btn role-btn w-100" id="bigCatBtn">🐱 大猫</button></div>
        <div class="col-md-4"><button class="btn role-btn w-100" id="guestBtn">👥 其他亲友</button></div>
    </div>
</div>

<!-- 熊家菜谱入口（仅桌面显示） -->
<div class="menu-entry-wrap text-center mt-4">
    <a href="/menu" class="menu-entry-btn">📖 熊家菜谱</a>
</div>

<!-- 功能选择模态框 -->
<div class="modal fade" id="actionModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 32px;">
            <div class="modal-header border-0 pt-4"><h5 class="modal-title w-100 text-center" id="actionModalTitle">选择操作</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body text-center pb-4"><div class="action-btn-group"><button class="btn action-btn" id="orderActionBtn">🍽️ 点餐（选择日期周）</button><button class="btn action-btn" id="historyActionBtn">📜 查看历史点单</button></div></div>
        </div>
    </div>
</div>

<!-- 万年历模态框 -->
<div class="modal fade" id="calendarModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 28px;">
            <div class="modal-header" style="background:#faefc9; border-bottom:1px solid #e8d8a0;"><h5 class="modal-title" style="color:#3a2800;">📅 选择点餐周</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body" id="calendarBody"></div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button></div>
        </div>
    </div>
</div>

<!-- 历史记录模态框 -->
<div class="modal fade" id="historyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content" style="border-radius: 28px;">
            <div class="modal-header"><h5 class="modal-title">📋 历史点餐记录</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body"><select id="historySelect" class="form-select mb-3"><option value="">-- 请选择周 --</option></select><pre id="historyContent" style="background:#faefc9; padding:16px; border-radius:20px; white-space:pre-wrap; font-family: monospace; color:#3a2800; border:1px solid #e8d8a0;"></pre></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentCustomer = '大熊';
    let actionModal = null, calendarModal = null, historyModal = null;
    let currentYear = new Date().getFullYear(), currentMonth = new Date().getMonth();

    document.getElementById('bigBearBtn').onclick = () => { currentCustomer = '大熊'; showActionModal(); };
    document.getElementById('bigCatBtn').onclick = () => { window.location.href = '/admin/login'; };
    document.getElementById('guestBtn').onclick = () => {
        let name = prompt('请输入您的姓名（最长20字）', '');
        if(name) {
            name = name.trim().slice(0, 20);
            if(name) { currentCustomer = name; showActionModal(); }
        }
    };

    function showActionModal() { if(!actionModal) actionModal = new bootstrap.Modal(document.getElementById('actionModal')); document.getElementById('actionModalTitle').innerHTML = `您好，${escapeHtml(currentCustomer)}<br><span class="fs-6 text-muted">请选择</span>`; actionModal.show(); }
    document.getElementById('orderActionBtn').onclick = () => { actionModal.hide(); showCalendar(); };
    document.getElementById('historyActionBtn').onclick = () => { actionModal.hide(); showHistory(); };

    function formatChineseDate(ymd) {
        // ymd: '2026-06-01' -> '2026年6月1日'
        const [y, m, d] = ymd.split('-').map(s => parseInt(s, 10));
        return `${y}年${m}月${d}日`;
    }

    function showHistory() {
        fetch('/api/order/history', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ customer_name: currentCustomer }) })
            .then(res => res.json()).then(data => {
                if(data.success && data.history.length) {
                    let select = document.getElementById('historySelect'); select.innerHTML = '<option value="">-- 请选择周 --</option>';
                    data.history.forEach(h => {
                        let opt = document.createElement('option');
                        opt.value = h.txt_content || '（暂无记录内容）';
                        const sun = new Date(h.week_sunday);
                        const mon = new Date(sun); mon.setDate(sun.getDate() + 1);
                        const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
                        opt.innerText = `${mon.getMonth()+1}月${mon.getDate()}日～${sat.getMonth()+1}月${sat.getDate()}日一周`;
                        select.appendChild(opt);
                    });
                    document.getElementById('historyContent').innerText = '';
                    select.onchange = () => { document.getElementById('historyContent').innerText = select.value; };
                    if(!historyModal) historyModal = new bootstrap.Modal(document.getElementById('historyModal')); historyModal.show();
                } else alert('暂无历史记录');
            });
    }

    function showCalendar() { if(!calendarModal) calendarModal = new bootstrap.Modal(document.getElementById('calendarModal')); generateCalendar(); calendarModal.show(); }

    // 计算"包含 d 的那一周的周日"（日历每行从周日开始）
    function sundayOf(d) {
        const r = new Date(d);
        r.setHours(0,0,0,0);
        r.setDate(r.getDate() - r.getDay()); // getDay()==0 时回退0天，正好是周日本身
        return r;
    }

    function ymdLocal(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function generateCalendar() {
        const container = document.getElementById('calendarBody'); container.innerHTML = '';
        const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
        const header = document.createElement('div'); header.className = 'month-nav';
        const prevBtn = document.createElement('button'); prevBtn.innerHTML = '‹ 上月';
        const monthTitle = document.createElement('span'); monthTitle.className = 'fw-bold fs-5'; monthTitle.innerText = `${currentYear}年 ${monthNames[currentMonth]}`;
        const nextBtn = document.createElement('button'); nextBtn.innerHTML = '下月 ›';
        header.appendChild(prevBtn); header.appendChild(monthTitle); header.appendChild(nextBtn); container.appendChild(header);

        const table = document.createElement('table'); table.className = 'calendar-table';
        const thead = document.createElement('thead'); const trHead = document.createElement('tr');
        ['日','一','二','三','四','五','六'].forEach(day => { const th = document.createElement('th'); th.innerText = day; trHead.appendChild(th); });
        thead.appendChild(trHead); table.appendChild(thead); const tbody = document.createElement('tbody');

        const firstDay = new Date(currentYear, currentMonth, 1);
        const startDayOfWeek = firstDay.getDay();
        const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();

        // 可选范围：从下周日开始的行；"下周日"= 本周日 + 7
        const today = new Date(); today.setHours(0,0,0,0);
        const nextSunday = sundayOf(today);
        nextSunday.setDate(nextSunday.getDate() + 7); // 跳过本周，本周菜单大猫已在备餐，最早只能点下周

        let row = null, dayCounter = 1;
        for(let i=0; i<6; i++) {
            row = document.createElement('tr');
            for(let col=0; col<7; col++) {
                const td = document.createElement('td');
                if(i===0 && col<startDayOfWeek) { td.innerHTML = ''; row.appendChild(td); continue; }
                if(dayCounter > daysInMonth) break;
                const d = dayCounter;
                const cellDate = new Date(currentYear, currentMonth, d);
                const rowSunday = sundayOf(cellDate);          // 该格所在行的周日
                const isSelectable = rowSunday >= nextSunday;
                td.innerText = d;
                if(!isSelectable) td.classList.add('disabled');
                else { td.classList.add('selectable'); td.setAttribute('data-sunday', ymdLocal(rowSunday)); }
                row.appendChild(td);
                dayCounter++;
            }
            if(dayCounter > daysInMonth && row.cells.length===0) break;
            const anySelectable = Array.from(row.cells).some(cell => cell.classList && cell.classList.contains('selectable'));
            if(anySelectable) {
                row.classList.add('selectable-row');
                row.style.cursor = 'pointer';
                let sundayStr = null;
                for(let cell of row.cells) if(cell.classList && cell.classList.contains('selectable')) { sundayStr = cell.getAttribute('data-sunday'); break; }
                if(sundayStr) {
                    row.onclick = (function(sunday) { return function() {
                        fetch('/api/order/check_existing', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ customer_name: currentCustomer, week_sunday: sunday })
                        })
                        .then(res => res.json()).then(data => {
                            if(data.exists && data.editable === false) {
                                alert(`检测到您已经点过 ${formatChineseDate(sunday)} 这周菜肴，由于时间临近已不能更改`);
                                return;
                            }
                            if(data.exists && data.editable !== false) {
                                if(confirm(`检测到您已经点过 ${formatChineseDate(sunday)} 这周的菜肴，是否需要修改点菜并覆盖之前的记录？\n（点"确定"为"是的"，点"取消"为"算了"）`))
                                    window.location.href = `/order?customer=${encodeURIComponent(currentCustomer)}&week_sunday=${sunday}&existing=${encodeURIComponent(data.order_data || '')}`;
                                else { calendarModal.hide(); }
                                return;
                            }
                            if(data.editable === false) {
                                alert(`${formatChineseDate(sunday)} 这周已过截止时间（周日上午10点），无法点餐`);
                                return;
                            }
                            window.location.href = `/order?customer=${encodeURIComponent(currentCustomer)}&week_sunday=${sunday}`;
                        });
                    }; })(sundayStr);
                }
            }
            tbody.appendChild(row);
        }
        table.appendChild(tbody); container.appendChild(table);
        prevBtn.onclick = () => { currentMonth--; if(currentMonth<0){currentMonth=11; currentYear--;} generateCalendar(); };
        nextBtn.onclick = () => { currentMonth++; if(currentMonth>11){currentMonth=0; currentYear++;} generateCalendar(); };
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
</script>
</body>
</html>
