<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类管理 - 熊家食堂</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .cat-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
        .cat-actions form, .cat-actions a { display: inline-block; }
        /* 暖金配色 */
        body { background: #fef7e8; color: #3a2800; font-family: 'Segoe UI','Noto Sans SC',system-ui; }
        h1 { color: #3a2800; font-weight: 700; }
        .card { border: 1px solid #e8d8a0 !important; border-radius: 16px !important; background: #fffcf4; }
        .card-header { background: #faefc9 !important; border-bottom: 1px solid #e8d8a0 !important; color: #7a5c1e; font-weight: 600; }
        .border.rounded { border-color: #e8d8a0 !important; background: #fffcf4; border-radius: 12px !important; }
        .btn-primary { background: #e9b741; border-color: #e9b741; color: #3a2800; font-weight: 500; }
        .btn-primary:hover,.btn-primary:focus,.btn-primary:active { background: #d4a12b !important; border-color: #d4a12b !important; color: #3a2800 !important; box-shadow: 0 0 0 0.2rem rgba(212,161,43,0.3) !important; }
        .btn-secondary { background: #f0e5c8; border-color: #e0ce9a; color: #7a5c1e; }
        .btn-secondary:hover { background: #e3d3a8; border-color: #ccba7a; color: #3a2800; }
        .btn-light { background: #faefc9; border-color: #e8d8a0; color: #7a5c1e; }
        .btn-light:hover { background: #f0e0a0; border-color: #d4a12b; color: #3a2800; }
        .form-control:focus,.form-select:focus { border-color: #e9b741; box-shadow: 0 0 0 0.2rem rgba(233,183,65,0.22); }
        .form-control,.form-select { border-color: #e8d8a0; background: #fffcf4; }
        @media (max-width: 767px) {
            .container { max-width: 100% !important; padding-left: 14px !important; padding-right: 14px !important; }
            h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between mb-3">
        <h1>📂 分类管理</h1>
        <a href="/admin/dashboard" class="btn btn-secondary">返回</a>
    </div>
    <div class="row">
        <div class="col-md-5">
            <div class="card mb-3">
                <div class="card-header">添加大分类</div>
                <div class="card-body">
                    <form method="post" action="/admin/category/add">
                        <input type="hidden" name="parent_id" value="0">
                        <div class="input-group">
                            <input type="text" name="name" class="form-control" placeholder="新分类名称" required>
                            <button class="btn btn-primary" type="submit">添加</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="card">
                <div class="card-header">添加子分类</div>
                <div class="card-body">
                    <form method="post" action="/admin/category/add">
                        <select name="parent_id" class="form-select mb-2" required>
                            <option value="">选择父分类</option>
                            {% for cat in categories if cat.parent_id == 0 %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                        <div class="input-group">
                            <input type="text" name="name" class="form-control" placeholder="子分类名称" required>
                            <button class="btn btn-primary" type="submit">添加</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card">
                <div class="card-header">现有分类（↑↓ 调整顺序）</div>
                <div class="card-body">
                    {% for cat in categories if cat.parent_id == 0 %}
                    <div class="mb-3 p-2 border rounded">
                        <div class="cat-row">
                            <form method="post" action="/admin/category/move" class="d-inline">
                                <input type="hidden" name="cat_id" value="{{ cat.id }}">
                                <input type="hidden" name="direction" value="up">
                                <button class="btn btn-sm btn-light" title="上移">↑</button>
                            </form>
                            <form method="post" action="/admin/category/move" class="d-inline">
                                <input type="hidden" name="cat_id" value="{{ cat.id }}">
                                <input type="hidden" name="direction" value="down">
                                <button class="btn btn-sm btn-light" title="下移">↓</button>
                            </form>
                            <strong class="me-auto">{{ cat.name }}</strong>
                            <span class="cat-actions">
                                <form method="post" action="/admin/category/edit/{{ cat.id }}" class="d-inline">
                                    <input type="text" name="name" value="{{ cat.name }}" class="form-control form-control-sm d-inline" style="width: 110px;">
                                    <button class="btn btn-sm btn-secondary">改名</button>
                                </form>
                                <a href="/admin/category/delete/{{ cat.id }}" class="btn btn-sm btn-danger" onclick="return confirm('删除大类需先清空其下子分类与菜品，确定继续？')">删除</a>
                            </span>
                        </div>
                        {% for sub in categories if sub.parent_id == cat.id %}
                        <div class="cat-row ms-4">
                            <form method="post" action="/admin/category/move" class="d-inline">
                                <input type="hidden" name="cat_id" value="{{ sub.id }}">
                                <input type="hidden" name="direction" value="up">
                                <button class="btn btn-sm btn-light" title="上移">↑</button>
                            </form>
                            <form method="post" action="/admin/category/move" class="d-inline">
                                <input type="hidden" name="cat_id" value="{{ sub.id }}">
                                <input type="hidden" name="direction" value="down">
                                <button class="btn btn-sm btn-light" title="下移">↓</button>
                            </form>
                            <span class="me-auto">↳ {{ sub.name }}</span>
                            <span class="cat-actions">
                                <form method="post" action="/admin/category/edit/{{ sub.id }}" class="d-inline">
                                    <input type="text" name="name" value="{{ sub.name }}" class="form-control form-control-sm d-inline" style="width: 110px;">
                                    <button class="btn btn-sm btn-secondary">改名</button>
                                </form>
                                <a href="/admin/category/delete/{{ sub.id }}" class="btn btn-sm btn-danger" onclick="return confirm('确定删除子分类？')">删除</a>
                            </span>
                        </div>
                        {% endfor %}
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
