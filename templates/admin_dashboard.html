<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>后台管理 - 熊家食堂</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #fef7e8; color: #3a2800; font-family: 'Segoe UI','Noto Sans SC',system-ui; }
        .card { border: 1px solid #e8d8a0 !important; border-radius: 16px !important; background: #fffcf4; }
        .card-body h5 { color: #3a2800; }
        .card-text { color: #7a5c1e; }
        .btn-primary { background: #e9b741; border-color: #e9b741; color: #3a2800; font-weight: 600; }
        .btn-primary:hover,.btn-primary:focus,.btn-primary:active { background: #d4a12b !important; border-color: #d4a12b !important; color: #3a2800 !important; box-shadow: 0 0 0 0.2rem rgba(212,161,43,0.3) !important; }
        .btn-outline-danger { border-color: #d9534f; color: #b02a27; }
        .btn-outline-danger:hover { background: #fdecea; border-color: #d9534f; color: #b02a27; }
        h1 { color: #3a2800; font-weight: 700; }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>🐱 大猫后台管理</h1>
        <a href="/admin/logout" class="btn btn-outline-danger">退出登录</a>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title">📋 订单管理</h5>
                    <p class="card-text">查看、下载订单TXT文件</p>
                    <a href="/admin/orders" class="btn btn-primary">进入</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title">🍽️ 菜品管理</h5>
                    <p class="card-text">增删改菜品、图片、规格</p>
                    <a href="/admin/dishes" class="btn btn-primary">进入</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title">📂 分类管理</h5>
                    <p class="card-text">管理大分类和子分类</p>
                    <a href="/admin/categories" class="btn btn-primary">进入</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
